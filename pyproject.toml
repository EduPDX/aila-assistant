[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aila-assistant"
version = "0.1.0"
description = "Assistente de IA local multimodal para Windows (NVIDIA RTX / CUDA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EduPDX" }]
keywords = ["ai", "assistant", "local-llm", "ollama", "agents", "multimodal"]

dependencies = [
    # --- Core / API ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Instale por fase, para não pesar o ambiente base.
computer = ["pyautogui>=0.9.54", "pygetwindow>=0.0.9", "pywin32>=306", "mss>=9.0"]
voice = ["faster-whisper>=1.0", "av>=11.0", "edge-tts>=6.1"]  # STT (Whisper) + TTS neural (Edge)
piper = ["piper-tts>=1.2"]                     # TTS neural de alta qualidade (opcional)
vision = ["mss>=9.0"]   # captura de tela; a análise é feita pelo modelo no Ollama
avatar = ["python-osc>=1.8"]   # ponte OSC para o avatar 3D no Unreal Engine
# leitura/criação de documentos (PDF/Word/Excel/PowerPoint). Tudo local/offline.
docs = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1", "fpdf2>=2.7", "python-pptx>=0.6"]
dev = ["ruff>=0.4", "pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
aila = "aila.main:run"

[tool.setuptools.packages.find]
include = ["aila*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Scripts que rodam em outros interpretadores (Ghidra/Jython, Unreal/Python): fora do lint.
extend-exclude = ["aila/tools/ghidra", "aila/tools/unreal"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B027: métodos de ciclo de vida opcionais em ABC (ex.: aclose) podem ser vazios.
ignore = ["E501", "B027"]

[tool.ruff.lint.per-file-ignores]
# B008: File(...)/Depends(...) em defaults é o idioma padrão do FastAPI.
"aila/api/*" = ["B008"]
