# ============================================================
#  Aila — configuração padrão
#  Sobrescreva via .env (prefixo AILA_) ou config/local.yaml
# ============================================================

app:
  name: "Aila"
  persona: >
    Você é a Aila, uma assistente de IA local rodando no computador do usuário.
    É objetiva, prestativa e técnica. Você tem acesso a ferramentas (agentes)
    para manipular arquivos, escrever código, controlar o computador, analisar
    imagens e binários. Sempre explique o que vai fazer antes de executar ações
    que alteram o sistema. Responda no idioma do usuário.


    Estilo ao responder código: seja direto, no estilo do ChatGPT/Claude. Não
    comece com preâmbulos como "Claro!" ou "Com certeza!". Vá direto ao ponto.
    Sempre coloque código em blocos cercados por crases triplas com a linguagem
    indicada (```python, ```bash, ```js, etc.) — isso ativa o realce de sintaxe
    e os botões de copiar/salvar/executar da interface. Uma explicação curta
    antes ou depois do bloco basta; não repita o código em prosa.

host: "127.0.0.1"
port: 8770
log_level: "INFO"

llm:
  backend: "ollama"           # ollama | llamacpp
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5:7b-instruct"      # conversa + tool-calling. INSTRUCT, não coder: o
                                    # coder responde CÓDIGO até p/ "oi" (foi treinado p/ isso)
  code_model: "qwen2.5-coder:7b"    # Code Agent (gerar/analisar/corrigir código)
  fast_model: "qwen2.5:3b-instruct" # papo casual/gesto: responde quase na hora (vazio = usa `model`)
  vision_model: "llava:7b"          # Vision Agent (ollama pull llava:7b)
  temperature: 0.7
  max_tokens: 2048
  num_ctx: 8192               # janela de contexto (Ollama usa só 2048 por padrão — sufoca o agente)
  # keep_alive: tempo que o Ollama mantém o modelo na VRAM
  keep_alive: "10m"
  timeout_seconds: 120

context:
  max_turns: 20               # janela de conversa mantida em memória
  summarize_after: 40         # resume histórico antigo após N turnos

network:
  # hybrid = permite online (pesquisa web, APIs externas, TTS neural Edge).
  # offline = nada sai do PC (só modelos/ferramentas locais).
  mode: "hybrid"

# Provedores EXTERNOS de LLM (compatíveis c/ a API OpenAI). Desligados por
# padrão. NUNCA ponha api_key aqui (arquivo versionado) — use variável de
# ambiente, ex.: AILA_PROVIDERS__OPENAI__API_KEY=sk-...  ou config/local.yaml.
providers:
  openai:
    enabled: false
    api_key: ""
    model: "gpt-4o-mini"
  gemini:
    enabled: false
    api_key: ""
    model: "gemini-2.0-flash"
  grok:
    enabled: false
    api_key: ""
    model: "grok-2-latest"
  deepseek:
    enabled: false
    api_key: ""
    model: "deepseek-chat"

# Roteamento de modelo por tarefa.
#   enabled: false → PASSTHROUGH: toda tarefa vai para o local, sem exceção
#                    (a classificação por complexidade continua rodando, mas não
#                    muda de provedor enquanto o roteamento estiver desligado).
#   enabled: true  → cada TIPO de tarefa tem uma ORDEM de provedores (fallback).
# O engine classifica cada turno num destes tipos (chaves válidas de `rules`):
#   basic     — cumprimento/conversa trivial (sempre prefere o local, rápido)
#   chat      — conversa geral
#   code      — programação
#   reasoning — pergunta complexa (derivada por complexidade ≥ 0.6)
#   vision    — entrada de imagem
# Um tipo ausente de `rules` cai no `default`. "local" = o modelo local.
# Habilite e configure em config/local.yaml, ex.:
#   routing: { enabled: true, default: "local",
#              rules: { reasoning: ["nvidia", "local"], code: ["gemini", "local"],
#                       vision: ["gemini", "local"] } }
routing:
  enabled: false
  default: "local"
  rules: {}

security:
  read_only: false            # Aila PODE agir (rodar comandos, mexer no PC); a
                              # proteção fica por conta da confirmação abaixo
  confirm_destructive: true   # ações DANGER pedem confirmação na UI (overlay ⚠️)
  confirm_review: false       # ações REVIEW (escrita comum) pedem confirmação?
  # Autonomia (1..5): 1 assistant(só leitura) · 2 executor(PC/arquivos) ·
  # 3 developer(código) · 4 autonomous · 5 self-improve. Default 3 preserva tudo.
  autonomy_level: 3
  sandbox_root: "./workspace" # raiz permitida para o File Agent
  # Ações classificadas como perigosas (exigem confirmação):
  destructive_actions:
    - "file.delete"
    - "file.overwrite"
    - "computer.run_command"
    - "computer.open_app"
    - "computer.keyboard"
    - "computer.mouse"
    - "code.execute"
  audit_log: "./logs/audit.jsonl"
  # ----- Hardening (Fase 10) -----
  tool_timeout: 180.0         # backstop: nenhuma ferramenta trava o agente p/ sempre (0=off)
  max_tool_calls: 20          # orçamento de ferramentas por tarefa autônoma (anti-loop)
  max_repeated_calls: 3       # mesma ferramenta+args repetida N vezes = loop → corta
  # Terminal: além dos padrões embutidos (formatar disco, desligar Defender,
  # baixar-e-executar, apagar backups, etc. → BLOQUEADOS), dá p/ acrescentar:
  command_denylist: []        # regex extra a bloquear no computer.run_command
  command_allowlist: []       # prefixos extra a tratar como leitura segura

agents:
  enabled:
    - file
    - code
    - documents  # ler/criar PDF, Word, Excel, PowerPoint, CSV, TXT, Markdown
    - git        # status/diff/branch/checkout/commit (backup+rollback do self-improve)
    - web        # pesquisa na internet + leitura de páginas (leitura, sem chave)
    - memory
    - vision
    - binary
    - avatar
    - computer   # controle do PC: janelas, mouse, teclado, abrir apps, rodar comandos
  disabled: []

voice:
  enabled: true
  stt:
    engine: "faster-whisper"
    model: "base"             # tiny | base | small | medium (baixa na 1ª vez)
    language: "pt"
    device: "auto"            # auto usa CUDA (RTX 4060) se disponível
  tts:
    engine: "auto"            # auto | sapi (Windows nativo) | piper (qualidade)
    voice: ""                 # vazio = auto (voz pt-BR do Windows, ex.: Maria)
    rate: 0                   # SAPI: -10 (lento) .. 10 (rápido)
    output_enabled: true      # Aila fala as respostas por padrão

avatar:
  enabled: false
  # websocket = avatar SVG no navegador (padrão)
  # osc       = motor 3D (Unreal) via OSC
  # both      = navegador + Unreal ao mesmo tempo
  transport: "websocket"
  osc_host: "127.0.0.1"       # onde o Unreal escuta OSC
  osc_port: 8000              # porta do OSC Server no Unreal
  default_emotion: "neutral"
  # --- Unreal via Remote Control (recomendado: sem OSC/Blueprint) ---
  # Habilite em config/local.yaml. Requer o plugin "Remote Control API".
  unreal_enabled: false
  unreal_rc_url: "http://127.0.0.1:30010"
  unreal_mesh_path: ""        # object path do componente de malha no nível
  unreal_anim_base: "/Game/CiciToonCharacterShaderPak/Character/Hayakawa/Anim/"

binary:
  # Pasta da instalação do Ghidra (contém support/analyzeHeadless).
  # Vazio = decompilação Ghidra desabilitada; a triagem (tipo, strings,
  # entropia, cabeçalho PE) funciona sem Ghidra.
  ghidra_path: ""
  analysis_timeout: 600

memory:
  enabled: true               # memória de longo prazo (RAG)
  embed_model: "nomic-embed-text"   # baixe com: ollama pull nomic-embed-text
  top_k: 4                    # memórias recuperadas por turno
  min_score: 0.55             # similaridade mínima (0-1) para injetar contexto
  store_conversations: true   # grava cada troca automaticamente
  db_path: "./data/memory.db"
