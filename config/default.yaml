# ============================================================
#  Aila — configuração padrão
#  Sobrescreva via .env (prefixo AILA_) ou config/local.yaml
# ============================================================

app:
  name: "Aila"
  persona: >
    Você é a Aila, uma assistente de IA local rodando no computador do usuário.
    É objetiva, prestativa e técnica. Você tem acesso a ferramentas (agentes)
    para manipular arquivos, escrever código, controlar o computador, analisar
    imagens e binários. Sempre explique o que vai fazer antes de executar ações
    que alteram o sistema. Responda no idioma do usuário.

host: "127.0.0.1"
port: 8770
log_level: "INFO"

llm:
  backend: "ollama"           # ollama | llamacpp
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5:7b-instruct"      # modelo de conversa padrão
  code_model: "deepseek-coder:6.7b" # usado pelo Code Agent
  vision_model: "llava:7b"          # usado pelo Vision Agent
  temperature: 0.7
  max_tokens: 2048
  # keep_alive: tempo que o Ollama mantém o modelo na VRAM
  keep_alive: "10m"
  timeout_seconds: 120

context:
  max_turns: 20               # janela de conversa mantida em memória
  summarize_after: 40         # resume histórico antigo após N turnos

security:
  read_only: true             # bloqueia toda escrita/execução até liberar
  confirm_destructive: true   # pede confirmação para ações perigosas
  sandbox_root: "./workspace" # raiz permitida para o File Agent
  # Ações classificadas como perigosas (exigem confirmação):
  destructive_actions:
    - "file.delete"
    - "file.overwrite"
    - "computer.run_command"
    - "computer.open_app"
    - "computer.keyboard"
    - "computer.mouse"
    - "code.execute"
  audit_log: "./logs/audit.jsonl"

agents:
  enabled:
    - file
    - code
    - memory
    - vision
    - binary
  # Agentes desabilitados por padrão (risco de controle do SO):
  disabled:
    - computer

voice:
  enabled: true
  stt:
    engine: "faster-whisper"
    model: "base"             # tiny | base | small | medium (baixa na 1ª vez)
    language: "pt"
    device: "auto"            # auto usa CUDA (RTX 4060) se disponível
  tts:
    engine: "auto"            # auto | sapi (Windows nativo) | piper (qualidade)
    voice: ""                 # vazio = auto (voz pt-BR do Windows, ex.: Maria)
    rate: 0                   # SAPI: -10 (lento) .. 10 (rápido)
    output_enabled: true      # Aila fala as respostas por padrão

avatar:
  enabled: false
  # websocket = avatar SVG no navegador (padrão)
  # osc       = motor 3D (Unreal) via OSC
  # both      = navegador + Unreal ao mesmo tempo
  transport: "websocket"
  osc_host: "127.0.0.1"       # onde o Unreal escuta OSC
  osc_port: 8000              # porta do OSC Server no Unreal
  default_emotion: "neutral"

binary:
  # Pasta da instalação do Ghidra (contém support/analyzeHeadless).
  # Vazio = decompilação Ghidra desabilitada; a triagem (tipo, strings,
  # entropia, cabeçalho PE) funciona sem Ghidra.
  ghidra_path: ""
  analysis_timeout: 600

memory:
  enabled: true               # memória de longo prazo (RAG)
  embed_model: "nomic-embed-text"   # baixe com: ollama pull nomic-embed-text
  top_k: 4                    # memórias recuperadas por turno
  min_score: 0.55             # similaridade mínima (0-1) para injetar contexto
  store_conversations: true   # grava cada troca automaticamente
  db_path: "./data/memory.db"
