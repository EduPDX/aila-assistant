<!DOCTYPE html>
<html lang="pt-BR" data-theme="aqua">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aila</title>
<style>
  /* ===================== TEMAS ===================== */
  :root, [data-theme="aqua"] {
    --bg:#0a0e14; --panel:#0f1620; --panel2:#131c28; --border:#1e2a3a;
    --text:#d7e0ea; --muted:#6b7c93; --accent:#35d0ba; --accent2:#4a9eff; --danger:#ff5c6c;
  }
  [data-theme="cyber"] {
    --bg:#0c0a16; --panel:#141026; --panel2:#1b1533; --border:#2c2350;
    --text:#e6ddff; --muted:#8a7db0; --accent:#c04bff; --accent2:#ff4bd8; --danger:#ff5c6c;
  }
  [data-theme="rose"] {
    --bg:#160d13; --panel:#22131c; --panel2:#2c1824; --border:#3d2130;
    --text:#ffe6f0; --muted:#b08a9c; --accent:#ff6fae; --accent2:#ffa96f; --danger:#ff5c6c;
  }
  [data-theme="forest"] {
    --bg:#0a1410; --panel:#0f1d17; --panel2:#13261d; --border:#1e3a2c;
    --text:#daf0e2; --muted:#6f9c85; --accent:#4be08a; --accent2:#a9e04b; --danger:#ff5c6c;
  }
  [data-theme="light"] {
    --bg:#eef2f6; --panel:#ffffff; --panel2:#f4f7fa; --border:#d9e0e8;
    --text:#1b2430; --muted:#5b6b7c; --accent:#0ca678; --accent2:#3b82f6; --danger:#e03131;
  }

  * { box-sizing:border-box; margin:0; }
  body { height:100vh; display:flex; background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  button { font-family:inherit; }

  /* ===================== DRAWER (config à esquerda) ===================== */
  .drawer { width:280px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 16px; gap:18px; overflow-y:auto; transition:margin-left .25s; }
  .drawer.collapsed { margin-left:-280px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .orb { width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--accent), #0006); box-shadow:0 0 16px var(--accent); }
  .brand h1 { font-size:17px; letter-spacing:2px; }
  .sec-title { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:8px; }
  .card { background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; font-size:12px; margin:6px 0; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  .dot.on { background:var(--accent); box-shadow:0 0 6px var(--accent); } .dot.off { background:var(--danger); }

  .themes { display:flex; gap:10px; flex-wrap:wrap; }
  .swatch { width:34px; height:34px; border-radius:9px; cursor:pointer; border:2px solid transparent;
    position:relative; }
  .swatch.active { border-color:var(--text); }
  .btn { width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--panel2);
    color:var(--text); cursor:pointer; font-size:13px; }
  .btn.accent { background:var(--accent); color:#06120f; border:none; font-weight:600; }
  .toggle { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; }
  .toggle .sw { width:36px; height:20px; border-radius:20px; background:var(--border); position:relative; transition:.2s; }
  .toggle .sw::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--muted); transition:.2s; }
  .toggle.on .sw { background:var(--accent); } .toggle.on .sw::after { left:18px; background:#fff; }

  /* ===================== ÁREA PRINCIPAL ===================== */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { height:52px; display:flex; align-items:center; gap:12px; padding:0 16px; border-bottom:1px solid var(--border); }
  .hamb { background:var(--panel2); border:1px solid var(--border); color:var(--text); width:36px; height:34px;
    border-radius:9px; cursor:pointer; font-size:16px; }
  .tabs { display:flex; gap:4px; background:var(--panel2); border:1px solid var(--border); border-radius:20px; padding:3px; }
  .tabs button { background:none; border:none; color:var(--muted); padding:6px 18px; border-radius:16px; cursor:pointer; font-size:13px; }
  .tabs button.active { background:var(--accent); color:#06120f; font-weight:600; }
  .spacer { flex:1; }
  .emochip { font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:1px;
    border:1px solid var(--border); border-radius:14px; padding:3px 12px; }

  .content { flex:1; position:relative; min-height:0; }
  .pane { position:absolute; inset:0; display:none; }
  .pane.active { display:flex; }

  /* --- aba Avatar --- */
  #pane-avatar { align-items:center; justify-content:center; }
  #avatar3d { width:100%; height:100%; border:none; background:transparent; }

  /* --- aba Conversa --- */
  #pane-chat { flex-direction:column; }
  .chat { flex:1; overflow-y:auto; padding:20px 12%; display:flex; flex-direction:column; gap:14px; }
  @media(max-width:1000px){ .chat{ padding:20px 5%; } }
  .msg { display:flex; }
  .bubble { padding:11px 14px; border-radius:12px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word;
    font-size:14px; border:1px solid var(--border); }
  .msg.user { justify-content:flex-end; } .msg.user .bubble { background:var(--panel2); }
  .msg.ai .bubble { background:var(--panel); flex:1; }
  .msg.ai .bubble.tool { background:color-mix(in srgb, var(--accent) 12%, var(--panel)); color:var(--accent);
    font-family:monospace; font-size:12.5px; }
  .msg.sys .bubble { background:transparent; color:var(--muted); font-size:12px; text-align:center; border:none; }
  .composer { padding:12px 12%; border-top:1px solid var(--border); }
  @media(max-width:1000px){ .composer{ padding:12px 5%; } }
  .cbox { display:flex; gap:8px; background:var(--panel2); border:1px solid var(--border); border-radius:14px; padding:8px; align-items:flex-end; }
  .cbox textarea { flex:1; background:none; border:none; color:var(--text); resize:none; font-family:inherit;
    font-size:14px; max-height:120px; outline:none; padding:6px; }
  .icon { background:var(--panel); border:1px solid var(--border); color:var(--muted); width:38px; height:38px;
    border-radius:10px; cursor:pointer; font-size:15px; }
  .icon.send { background:var(--accent); color:#06120f; border:none; } .icon.rec { background:var(--danger); color:#fff; border:none; }

  /* modal permissão */
  .overlay { position:fixed; inset:0; background:#0009; display:none; align-items:center; justify-content:center; z-index:50; }
  .overlay.show { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--danger); border-radius:14px; padding:22px; width:440px; }
  .modal h3 { color:var(--danger); margin-bottom:8px; }
  .modal pre { background:var(--panel2); padding:10px; border-radius:8px; font-size:12px; color:var(--muted); overflow-x:auto; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }
</style>
</head>
<body>
  <!-- ========== DRAWER DE CONFIGURAÇÃO ========== -->
  <aside class="drawer" id="drawer">
    <div class="brand"><div class="orb"></div><h1>AILA</h1></div>

    <div>
      <div class="sec-title">Aparência · tema</div>
      <div class="themes" id="themes"></div>
    </div>

    <div>
      <div class="sec-title">Avatar 3D</div>
      <button class="btn accent" id="pickvrm">📁 Escolher modelo VRM</button>
      <input type="file" id="vrmfile" accept=".vrm" style="display:none" />
      <div id="vrmnote" style="font-size:11px;color:var(--muted);margin-top:6px"></div>
    </div>

    <div>
      <div class="sec-title">Voz</div>
      <div class="card">
        <div class="toggle on" id="tg-voice"><div class="sw"></div><span>Aila fala as respostas</span></div>
      </div>
    </div>

    <div>
      <div class="sec-title">Status</div>
      <div class="card">
        <div class="row"><span>LLM</span><span id="s-llm"><span class="dot off"></span>—</span></div>
        <div class="row"><span>Modelo</span><span id="s-model" style="color:var(--muted)">—</span></div>
        <div class="row"><span>Voz</span><span id="s-voice" style="color:var(--muted)">—</span></div>
        <div class="row"><span>🧠 Memórias</span><span id="s-mem" style="color:var(--muted)">—</span></div>
      </div>
    </div>
    <div style="flex:1"></div>
    <div style="font-size:10px;color:var(--muted)">Aila · assistente local</div>
  </aside>

  <!-- ========== ÁREA PRINCIPAL ========== -->
  <main class="main">
    <div class="topbar">
      <button class="hamb" onclick="document.getElementById('drawer').classList.toggle('collapsed')">☰</button>
      <div class="tabs">
        <button id="tab-avatar" class="active" onclick="showTab('avatar')">Avatar</button>
        <button id="tab-chat" onclick="showTab('chat')">Conversa</button>
      </div>
      <div class="spacer"></div>
      <div class="emochip" id="emochip">neutral</div>
    </div>

    <div class="content">
      <section id="pane-avatar" class="pane active">
        <iframe id="avatar3d" src="/static/avatar3d.html"></iframe>
      </section>

      <section id="pane-chat" class="pane">
        <div class="chat" id="chat">
          <div class="msg sys"><div class="bubble">Converse com a Aila. As respostas aparecem aqui e o avatar reage na aba Avatar.</div></div>
        </div>
        <div class="composer">
          <div class="cbox">
            <textarea id="input" rows="1" placeholder="Fale com a Aila…  (Enter envia)"></textarea>
            <button class="icon" id="mic" title="Falar" onclick="toggleMic()">🎙</button>
            <button class="icon send" onclick="send()">➤</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3>⚠ Confirmação necessária</h3>
      <p>A Aila quer executar <code id="perm-action"></code>.</p>
      <pre id="perm-params"></pre>
      <div class="modal-actions">
        <button class="btn" onclick="respondPerm(false)">Negar</button>
        <button class="btn accent" onclick="respondPerm(true)">Permitir</button>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  /* ============ TEMAS ============ */
  const THEMES = [
    {id:'aqua', c:'#35d0ba'}, {id:'cyber', c:'#c04bff'}, {id:'rose', c:'#ff6fae'},
    {id:'forest', c:'#4be08a'}, {id:'light', c:'#0ca678'},
  ];
  function setTheme(id) {
    document.documentElement.setAttribute('data-theme', id);
    localStorage.setItem('aila-theme', id);
    document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.id === id));
  }
  THEMES.forEach(t => {
    const s = document.createElement('div');
    s.className = 'swatch'; s.dataset.id = t.id; s.style.background = t.c; s.title = t.id;
    s.onclick = () => setTheme(t.id); $('themes').appendChild(s);
  });
  setTheme(localStorage.getItem('aila-theme') || 'aqua');

  /* ============ ABAS ============ */
  function showTab(t) {
    $('pane-avatar').classList.toggle('active', t === 'avatar');
    $('pane-chat').classList.toggle('active', t === 'chat');
    $('tab-avatar').classList.toggle('active', t === 'avatar');
    $('tab-chat').classList.toggle('active', t === 'chat');
  }

  /* ============ AVATAR (postMessage p/ o iframe) ============ */
  function toAvatar(msg) { const f = $('avatar3d'); if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*'); }

  /* ============ CHAT / WEBSOCKET ============ */
  const chat = $('chat'), input = $('input');
  let ws, aiBubble = null, currentPermId = null, voiceOut = true;

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    ws.onclose = () => { setLlm(false); setTimeout(connect, 2000); };
  }
  function handle(m) {
    switch (m.type) {
      case 'assistant.token':
        if (!aiBubble) aiBubble = addBubble('ai', '');
        aiBubble.textContent += m.text; scroll(); break;
      case 'assistant.message':
        if (!aiBubble) addBubble('ai', m.text);
        aiBubble = null;
        if (voiceOut && m.text) speak(m.text);
        break;
      case 'agent.invoked': addBubble('ai', `↳ ${m.tool}(${JSON.stringify(m.args)})`, 'tool'); break;
      case 'agent.result': addBubble('ai', `✓ ${m.tool}: ${m.content}`, 'tool'); break;
      case 'avatar.state':
        $('emochip').textContent = m.emotion;
        toAvatar({ type:'aila:emotion', value:m.emotion, state:m.animation });
        break;
      case 'memory.recalled': addBubble('ai', `🧠 lembrei de ${m.items.length} memória(s)`, 'tool'); break;
      case 'permission.request': showPerm(m); break;
      case 'error': addBubble('sys', 'erro: ' + m.message); aiBubble = null; break;
    }
  }
  function addBubble(role, text, extra='') {
    const w = document.createElement('div'); w.className = 'msg ' + role;
    const b = document.createElement('div'); b.className = 'bubble ' + extra; b.textContent = text;
    w.appendChild(b); chat.appendChild(w); scroll(); return b;
  }
  function scroll() { chat.scrollTop = chat.scrollHeight; }
  function sendText(t) { if (!t || ws.readyState !== 1) return; addBubble('user', t); aiBubble = null;
    ws.send(JSON.stringify({ type:'user.message', text:t, mode:'auto' })); }
  function send() { const t = input.value.trim(); if (!t) return; sendText(t); input.value=''; input.style.height='auto'; }
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  input.addEventListener('input', () => { input.style.height='auto'; input.style.height=input.scrollHeight+'px'; });

  /* ============ PERMISSÃO ============ */
  function showPerm(m) { currentPermId = m.id; $('perm-action').textContent = m.action;
    $('perm-params').textContent = JSON.stringify(m.params, null, 2); $('overlay').classList.add('show'); }
  function respondPerm(ok) { ws.send(JSON.stringify({ type:'permission.response', id:currentPermId, approved:ok }));
    $('overlay').classList.remove('show'); }

  /* ============ VOZ: saída (fala + lip-sync p/ avatar) ============ */
  let ttsAudio, lipCtx, lipAnalyser, lipBuf;
  async function speak(text) {
    try {
      const r = await fetch('/api/voice/speak', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text}) });
      if (!r.ok) return;
      const blob = await r.blob();
      if (ttsAudio) { try{ttsAudio.pause();}catch(e){} }
      ttsAudio = new Audio(URL.createObjectURL(blob));
      lipCtx = lipCtx || new (window.AudioContext||window.webkitAudioContext)();
      if (lipCtx.state === 'suspended') await lipCtx.resume();
      const src = lipCtx.createMediaElementSource(ttsAudio);
      lipAnalyser = lipCtx.createAnalyser(); lipAnalyser.fftSize = 1024; lipBuf = new Uint8Array(lipAnalyser.fftSize);
      src.connect(lipAnalyser); lipAnalyser.connect(lipCtx.destination);
      driveMouth();
      ttsAudio.onended = () => { lipAnalyser = null; toAvatar({type:'aila:mouth', value:0}); };
      await ttsAudio.play();
    } catch(e) {}
  }
  function driveMouth() {
    if (!lipAnalyser) return;
    lipAnalyser.getByteTimeDomainData(lipBuf);
    let sum=0; for (let i=0;i<lipBuf.length;i++){ const v=(lipBuf[i]-128)/128; sum+=v*v; }
    toAvatar({ type:'aila:mouth', value: Math.min(1, Math.sqrt(sum/lipBuf.length)*4.5) });
    requestAnimationFrame(driveMouth);
  }

  /* ============ VOZ: entrada (microfone) ============ */
  let recording=false, mediaRec=null, micStream=null, audioCtx=null, chunks=[];
  function toggleMic() { recording ? stopRec() : startRec(); }
  async function startRec() {
    try { micStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ addBubble('sys','sem acesso ao microfone'); return; }
    recording=true; $('mic').classList.add('rec'); chunks=[];
    mediaRec = new MediaRecorder(micStream);
    mediaRec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mediaRec.onstop = onRecStop; mediaRec.start(); detectSilence();
  }
  function stopRec() { recording=false; $('mic').classList.remove('rec');
    try{ mediaRec && mediaRec.state!=='inactive' && mediaRec.stop(); }catch(e){}
    if (audioCtx){ try{audioCtx.close();}catch(e){} audioCtx=null; }
    if (micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; } }
  function detectSilence() {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const an = audioCtx.createAnalyser(); an.fftSize=2048;
    audioCtx.createMediaStreamSource(micStream).connect(an);
    const buf = new Uint8Array(an.fftSize); let spoke=false, last=Date.now(), start=Date.now();
    (function loop(){ if(!recording) return; an.getByteTimeDomainData(buf);
      let s=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; s+=v*v; }
      const rms=Math.sqrt(s/buf.length), now=Date.now();
      if (rms>0.04){ spoke=true; last=now; }
      if ((spoke && now-last>1200) || now-start>15000 || (!spoke && now-start>6000)) {
        if (mediaRec && mediaRec.state!=='inactive') mediaRec.stop(); return; }
      requestAnimationFrame(loop); })();
  }
  async function onRecStop() {
    if (audioCtx){ try{audioCtx.close();}catch(e){} audioCtx=null; }
    if (micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    recording=false; $('mic').classList.remove('rec');
    if (!chunks.length) return;
    const fd = new FormData(); fd.append('file', new Blob(chunks,{type:'audio/webm'}), 'fala.webm');
    try { const j = await (await fetch('/api/voice/transcribe',{method:'POST',body:fd})).json();
      if ((j.text||'').trim()) { showTab('chat'); sendText(j.text.trim()); } } catch(e){}
  }

  /* ============ TROCAR VRM (no drawer) ============ */
  $('pickvrm').onclick = () => $('vrmfile').click();
  $('vrmfile').onchange = async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    $('vrmnote').textContent = 'enviando…';
    try {
      const fd = new FormData(); fd.append('file', f, f.name);
      const r = await fetch('/api/avatar/vrm', { method:'POST', body:fd });
      $('vrmnote').textContent = r.ok ? '✓ trocado' : 'falhou';
      if (r.ok) toAvatar({ type:'aila:reloadVRM' });
    } catch(e){ $('vrmnote').textContent = 'falhou'; }
    setTimeout(()=>$('vrmnote').textContent='', 4000); ev.target.value='';
  };

  /* ============ TOGGLE VOZ ============ */
  $('tg-voice').onclick = () => { voiceOut = !voiceOut; $('tg-voice').classList.toggle('on', voiceOut); };

  /* ============ STATUS ============ */
  function setLlm(on){ $('s-llm').innerHTML = `<span class="dot ${on?'on':'off'}"></span>${on?'online':'offline'}`; }
  async function loadStatus() {
    try {
      const s = await (await fetch('/api/status')).json();
      setLlm(s.llm_online); $('s-model').textContent = s.model; $('s-mem').textContent = s.memory_count ?? 0;
      const v = await (await fetch('/api/voice/status')).json();
      $('s-voice').textContent = v.enabled ? (v.tts_engine + ' · ' + (v.tts_voice||'')) : 'off';
    } catch(e){ setLlm(false); }
  }

  connect(); loadStatus(); setInterval(loadStatus, 8000);
</script>
</body>
</html>
