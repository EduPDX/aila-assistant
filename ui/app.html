<!DOCTYPE html>
<html lang="pt-BR" data-theme="aqua">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob: ws://127.0.0.1:* ws://localhost:* wss://127.0.0.1:* wss://localhost:*; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'" />
<title>Aila</title>
<link rel="stylesheet" href="/static/styles/tokens.css" />
<link rel="stylesheet" href="/static/styles/app.css" />
</head>
<body>
  <!-- ========== BOOT (splash HUD de inicialização) ========== -->
  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="boot-title">AILA</div>
      <div class="boot-sub">SISTEMA DE ASSISTÊNCIA PESSOAL</div>
      <div class="boot-lines" id="boot-lines"></div>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>

  <!-- ========== SIDEBAR (linha do tempo) ========== -->
  <aside class="sidebar" id="drawer">
    <div class="brand">
      <div class="orb"></div><h1>AILA</h1>
      <button class="gear" id="btn-settings" title="Configurações">⚙️</button>
    </div>
    <button class="mind-navbtn mind-open" id="btn-mind" title="O grafo da mente da Aila (código e conversa)">🧠 <span>Subconsciente</span></button>

    <!-- Ações rápidas -->
    <div class="cx-actions">
      <button class="btn accent" id="btn-new" title="Começar uma nova conversa">＋ Nova conversa</button>
      <button class="icon-btn" id="btn-attachdir-side" title="Anexar uma pasta (a Aila lê direto do disco)">📁</button>
    </div>

    <!-- Central de comando (seções) -->
    <div class="central" id="central">
      <section class="cx-sec">
        <div class="cx-h">🗂️ PROJETOS <button class="cx-add" id="cx-addproj" title="Adicionar projeto">＋</button></div>
        <div class="cx-body" id="cx-projects"><div class="cx-empty">—</div></div>
      </section>
      <section class="cx-sec">
        <div class="cx-h">⚡ TAREFAS</div>
        <div class="cx-body" id="cx-tasks"><div class="cx-empty">—</div></div>
      </section>
      <section class="cx-sec">
        <div class="cx-h">🧩 O QUE ELA SABE</div>
        <div class="cx-body" id="cx-memory"><div class="cx-empty">—</div></div>
      </section>
    </div>
  </aside>

  <!-- fundo escuro da gaveta (mobile): fica acima do iframe do avatar -->
  <div class="scrim" id="scrim"></div>

  <!-- ========== ÁREA PRINCIPAL ========== -->
  <main class="main">
    <div class="topbar">
      <button class="icon-btn hamb" id="btn-hamb" title="Menu">☰</button>
      <div class="tabs">
        <button id="tab-avatar" class="active">Avatar</button>
        <button id="tab-chat">Conversa</button>
      </div>
      <div class="spacer"></div>
      <div class="statuscluster" id="topbar-status"></div>
      <div class="emochip" id="emochip">neutral</div>
      <button class="icon-btn drawer-toggle" id="btn-drawer" title="Atividade da Aila">▤</button>
    </div>

    <div class="content stage">
      <section id="pane-avatar" class="pane active">
        <iframe id="avatar3d" src="/static/avatar3d.html"></iframe>
      </section>

      <section id="pane-chat" class="pane">
        <div class="chat" id="chat">
          <div class="msg sys"><div class="bubble">Converse com a Aila — ela responde aqui e reage no avatar.</div></div>
        </div>
      </section>

      <!-- composer: sempre visível (em cima das abas Avatar e Conversa) -->
      <div class="composer stage-composer">
        <div class="attachments" id="attachments"></div>
        <div class="cbox">
          <button class="icon-btn" id="attach" title="Anexar arquivo">📎</button>
          <button class="icon-btn" id="attachdir" title="Anexar pasta (a Aila lê direto do disco)">📁</button>
          <input type="file" id="attachfile" multiple style="display:none" />
          <textarea id="input" rows="1" placeholder="Fale com a Aila…  (Enter envia)"></textarea>
          <button class="icon-btn" id="mic" title="Falar">🎙</button>
          <button class="icon-btn stop" id="btn-stop" title="Parar de falar">⏹</button>
          <button class="icon-btn send" id="btn-send" title="Enviar">➤</button>
        </div>
      </div>

      <section id="pane-mind" class="pane mind">
        <div class="mind-graphwrap">
          <canvas id="mind-canvas"></canvas>
          <div class="mind-kindsel" id="mind-kindsel">
            <button data-k="code" class="active">Código</button>
            <button data-k="knowledge">Conhecimento</button>
            <button data-k="project">Projetos</button>
          </div>
          <button class="mind-back" id="mind-back" title="Voltar aos projetos" hidden>‹ Projetos</button>
          <button class="mind-close" id="mind-close" title="Voltar ao avatar">✕</button>
          <div class="mind-empty" id="mind-empty" hidden></div>
          <div class="mind-grid" id="mind-grid" hidden></div>
          <div class="mind-stats" id="mind-stats"></div>
        </div>
        <aside class="mind-side">
          <input id="mind-search" class="mind-search" placeholder="Buscar nós…" autocomplete="off" />
          <div class="mind-nodeinfo" id="mind-nodeinfo"></div>
          <div class="mind-comm-h">COMUNIDADES <label class="mind-all"><input type="checkbox" id="mind-all" checked> todas</label></div>
          <div class="mind-comm" id="mind-comm"></div>
        </aside>
      </section>
    </div>
  </main>

  <!-- ========== PAINEL DE STATUS (direita) ========== -->
  <aside class="statuspanel" id="statuspanel"></aside>

  <!-- ========== CONFIGURAÇÕES (⚙️) ========== -->
  <div class="overlay" id="settings-overlay">
    <div class="settings">
      <div class="settings-side" id="settings-nav"></div>
      <div class="settings-main" id="settings-main"></div>
    </div>
  </div>

  <!-- ========== MODAL DE PERMISSÃO ========== -->
  <div class="overlay" id="perm-overlay">
    <div class="modal perm" id="perm-modal">
      <div class="perm-head">
        <span class="perm-icon">🔒</span>
        <div class="perm-headtext">
          <h3>A Aila pediu permissão</h3>
          <div class="perm-human" id="perm-human"></div>
        </div>
        <span class="perm-risk" id="perm-risk"></span>
      </div>
      <div class="perm-code">ferramenta: <code id="perm-action"></code></div>
      <pre id="perm-params"></pre>
      <div class="modal-actions">
        <button class="btn" id="perm-deny">Negar</button>
        <button class="btn accent" id="perm-allow">Permitir</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
