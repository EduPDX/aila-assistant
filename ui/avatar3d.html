<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aila — Avatar 3D</title>
<style>
  :root { --accent:#35d0ba; --bg:#0a0e14; --panel:#0f1620; --border:#1e2a3a; --muted:#6b7c93; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:radial-gradient(circle at 50% 30%, #16202c, var(--bg)); overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif; color:#d7e0ea; }
  #app { position:fixed; inset:0; }
  #canvas { width:100%; height:100%; display:block; }
  #hud { position:fixed; left:14px; top:12px; font-size:12px; color:var(--muted);
    background:rgba(15,22,32,.6); border:1px solid var(--border); border-radius:10px; padding:8px 12px; }
  #hud b { color:var(--accent); }
  #emotion { color:var(--accent); text-transform:uppercase; letter-spacing:1px; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:8%;
    text-align:center; line-height:1.6; }
  #err.show { display:flex; }
  #err code { background:var(--panel); padding:2px 6px; border-radius:4px; color:var(--accent); }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
</style>
</head>
<body>
  <div id="app"><canvas id="canvas"></canvas></div>
  <div id="loading">carregando avatar 3D…</div>
  <div id="hud">
    <div>Aila · avatar 3D (VRM)</div>
    <div>emoção: <span id="emotion">neutral</span> · <span id="state">idle</span></div>
  </div>
  <div id="controls" style="position:fixed;right:14px;top:12px;display:flex;gap:8px;align-items:center">
    <span id="vrmnote" style="font-size:11px;color:var(--muted)"></span>
    <button id="pick" style="background:var(--panel);border:1px solid var(--border);
      color:var(--accent);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px">
      📁 Escolher VRM</button>
    <input type="file" id="vrmfile" accept=".vrm" style="display:none" />
  </div>
  <div id="err">
    <div>
      <h2>Nenhum modelo VRM encontrado 🙈</h2>
      <p>Coloque um arquivo <code>.vrm</code> em <code>ui/models/avatar.vrm</code><br>
      (crie um grátis no <b>VRoid Studio</b> e exporte como VRM), ou abra com
      <code>?model=URL</code>.</p>
      <p id="errdetail" style="color:var(--muted);font-size:12px;margin-top:10px"></p>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.6/lib/three-vrm.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const MODEL_URL = params.get('model') || '/static/models/avatar.vrm';

// ---------------- cena ----------------
const renderer = new THREE.WebGLRenderer({ canvas: $('canvas'), antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 20);
camera.position.set(0, 1.3, 1.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.28, 0);
controls.enablePan = false;
controls.minDistance = 0.8; controls.maxDistance = 4;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(1, 2, 2); scene.add(dir);
const rim = new THREE.DirectionalLight(0x35d0ba, 0.6);
rim.position.set(-1, 1, -2); scene.add(rim);

// alvo do olhar (lookAt): fica perto da câmera, com micro-desvios (sacadas)
const gazeTarget = new THREE.Object3D();
scene.add(gazeTarget);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------- carregar VRM ----------------
let vrm = null;
const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));

function disposeVRM() {
  if (!vrm) return;
  scene.remove(vrm.scene);
  try { VRMUtils.deepDispose?.(vrm.scene); } catch(e){}
  vrm = null; window.vrm = null;
}

function loadVRM(url) {
  $('err').classList.remove('show');
  $('loading').style.display = 'flex';
  loader.load(url, (gltf) => {
    disposeVRM();
    vrm = gltf.userData.vrm;
    // (sem as otimizações removeUnnecessary*/combineSkeletons: quebram o
    //  skinning de vários modelos — deixam rosto/olho "parados")
    if (vrm.meta?.metaVersion === '0') VRMUtils.rotateVRM0(vrm);  // VRM0 encara a câmera
    vrm.scene.traverse((o) => { o.frustumCulled = false; });
    scene.add(vrm.scene);
    window.vrm = vrm;
    for (const b in _cur) delete _cur[b]; _target = POSES.rest;  // começa no rest
    try { if (vrm.lookAt) vrm.lookAt.target = gazeTarget; } catch(e){}  // olhos seguem o alvo
    resetLife();                                    // zera fase de respiração/gaze
    try { vrm.springBoneManager?.reset?.(); } catch(e){}  // molas (cabelo/saia) assentadas
    clock.getDelta();                               // zera o dt (evita a saia "explodir")
    $('loading').style.display = 'none';
  }, undefined, (e) => {
    $('loading').style.display = 'none';
    $('err').classList.add('show');
    $('errdetail').textContent = 'tentei carregar: ' + url + '  ·  ' + (e?.message || e);
  });
}
loadVRM(MODEL_URL);

// ============================================================
//  SISTEMA DE POSE POR OSSO (humanoid VRM — padronizado p/ qualquer modelo)
//  Cada pose é um mapa { osso: [xGraus, yGraus, zGraus] } aplicado com
//  interpolação suave. Ossos não citados numa pose voltam ao "rest".
// ============================================================
const DEG = Math.PI / 180;

// ossos que o sistema controla (o resto do corpo fica com a pose base do modelo)
const CTRL_BONES = [
  'leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm',
  'leftHand', 'rightHand', 'head',
];

// biblioteca de poses/gestos (graus). "rest" = braços abaixados ao lado do corpo.
const POSES = {
  rest:        { leftUpperArm:[0,0,-72], rightUpperArm:[0,0,72], leftLowerArm:[0,4,-10], rightLowerArm:[0,-4,10] },
  wave:        { rightUpperArm:[0,0,150], rightLowerArm:[0,-25,20] },   // acena (braço p/ cima)
  thumbs_up:   { rightUpperArm:[-25,0,80], rightLowerArm:[-95,0,10] },  // joinha na frente
  point:       { rightUpperArm:[-80,0,74], rightLowerArm:[0,0,5] },     // aponta pra frente
  hand_explain:{ leftUpperArm:[-35,0,-70], rightUpperArm:[-35,0,70], leftLowerArm:[-40,10,-20], rightLowerArm:[-40,-10,20] },
  shrug:       { leftUpperArm:[0,0,-110], rightUpperArm:[0,0,110], leftLowerArm:[0,40,-80], rightLowerArm:[0,-40,80] },
  think:       { rightUpperArm:[-60,0,66], rightLowerArm:[-115,0,10], head:[10,-8,0] },  // mão no queixo
  cheer:       { leftUpperArm:[0,0,-165], rightUpperArm:[0,0,165] },    // dois braços pra cima
  raise_right: { rightUpperArm:[0,0,168] },                            // levanta a mão direita
  raise_left:  { leftUpperArm:[0,0,-168] },                            // levanta a mão esquerda
};
const GESTURE_ALIASES = { nice:'thumbs_up', none:'rest', nod:'rest' };

const _cur = {};                 // rotação atual (rad) por osso, para interpolar
let _target = POSES.rest;        // pose-alvo atual
let _gestureTimer = null;

function setPose(name) {
  const key = GESTURE_ALIASES[name] || name;
  if (!POSES[key]) return;
  _target = { ...POSES.rest, ...POSES[key] };
  clearTimeout(_gestureTimer);
  if (key !== 'rest') {          // gesto: volta ao rest depois de um tempo
    _gestureTimer = setTimeout(() => { _target = POSES.rest; }, 2800);
  }
}
window.ailaGesture = setPose;    // permite testar: ailaGesture('wave')

function applyBody(dt) {
  const h = vrm?.humanoid; if (!h) return;
  const k = Math.min(1, dt * 6);
  for (const bone of CTRL_BONES) {
    const node = h.getNormalizedBoneNode(bone); if (!node) continue;
    const t = _target[bone] || [0, 0, 0];
    const c = _cur[bone] || (_cur[bone] = [0, 0, 0]);
    c[0] += (t[0] * DEG - c[0]) * k;
    c[1] += (t[1] * DEG - c[1]) * k;
    c[2] += (t[2] * DEG - c[2]) * k;
    node.rotation.set(c[0], c[1], c[2]);
  }
}
window.__applyBody = applyBody;  // debug

// ============================================================
//  VIDA PROCEDURAL — camada orgânica por cima da pose base.
//  Objetivo: nunca "NPC parado". Respiração contínua, deslocamento de
//  peso, micro-movimentos de cabeça/pescoço/ombros, olhar com sacadas e
//  linguagem corporal por emoção. Tudo ADITIVO: a pose (braços/gestos) e
//  o lip-sync continuam mandando; a vida só soma deslocamentos pequenos.
// ============================================================

// ruído suave ~[-1,1]: soma de senoides incomensuráveis (não repete "na cara")
function noise(t) {
  return (Math.sin(t) + Math.sin(t * 2.13 + 1.1) * 0.5 + Math.sin(t * 0.5 + 2.7) * 0.7) / 2.2;
}
const lerp = (a, b, t) => a + (b - a) * t;

// perfil de linguagem corporal por emoção (postura base em GRAUS + energia).
//  amp = amplitude geral · speed = velocidade dos micro-movimentos
//  breath = ritmo respiratório · spine/head = inclinação base (postura)
//  gaze = modo do olhar · gazeAmp = quão "solto" o olhar vagueia
const EMO_PROFILE = {
  neutral:   { amp:1.00, speed:1.00, breath:1.00, spine:[0,0,0],  head:[0,0,0],  gaze:'soft', gazeAmp:1.0 },
  happy:     { amp:1.35, speed:1.25, breath:1.15, spine:[-2,0,0], head:[-2,0,0], gaze:'soft', gazeAmp:1.2 }, // queixo pra cima, peito aberto
  relaxed:   { amp:0.85, speed:0.85, breath:0.92, spine:[1,0,0],  head:[2,0,0],  gaze:'soft', gazeAmp:0.8 },
  sad:       { amp:0.55, speed:0.70, breath:0.82, spine:[6,0,0],  head:[9,0,0],  gaze:'down', gazeAmp:0.5 }, // ombros caídos, olhar baixo
  angry:     { amp:1.20, speed:1.30, breath:1.20, spine:[-3,0,0], head:[-4,0,0], gaze:'lock', gazeAmp:0.6 },
  surprised: { amp:1.30, speed:1.40, breath:1.10, spine:[-4,0,0], head:[-5,0,0], gaze:'lock', gazeAmp:1.4 },
};
// olhar "pensativo": vagueia pra cima/lado (associado a emoções cruas do backend)
const GAZE_BY_RAW = { thinking:'wander', focused:'wander', confused:'wander', sad:'down' };

const life = {
  t: 0,
  target: EMO_PROFILE.neutral,
  cur: { amp:1, speed:1, breath:1, sx:0, sy:0, sz:0, hx:0, hy:0, hz:0, gazeAmp:1 },
  speech: 0,        // envelope 0..1 de "está falando" (dirige ênfase corporal)
  gazeMode: 'soft',
};
function resetLife() { life.t = 0; life.speech = 0; gaze.yaw = gaze.pitch = 0; gaze.saccade = 0; }

function setBone(h, bone, x, y, z) {
  const n = h.getNormalizedBoneNode(bone); if (n) n.rotation.set(x, y, z);
}

function updateLife(dt) {
  const h = vrm?.humanoid; if (!h) return;
  life.t += dt;

  // interpola os parâmetros do perfil (transições suaves entre emoções)
  const T = life.target, c = life.cur, k = Math.min(1, dt * 2.5);
  c.amp = lerp(c.amp, T.amp, k); c.speed = lerp(c.speed, T.speed, k);
  c.breath = lerp(c.breath, T.breath, k); c.gazeAmp = lerp(c.gazeAmp, T.gazeAmp, k);
  c.sx = lerp(c.sx, T.spine[0]*DEG, k); c.sy = lerp(c.sy, T.spine[1]*DEG, k); c.sz = lerp(c.sz, T.spine[2]*DEG, k);
  c.hx = lerp(c.hx, T.head[0]*DEG, k);  c.hy = lerp(c.hy, T.head[1]*DEG, k);  c.hz = lerp(c.hz, T.head[2]*DEG, k);

  const amp = c.amp, t = life.t * c.speed;

  // respiração: ciclo ~4s, acelera ao falar
  const breathHz = 0.25 * c.breath * (1 + life.speech * 0.35);
  const breath = Math.sin(life.t * breathHz * Math.PI * 2);  // -1..1
  const inhale = (breath + 1) / 2;                            // 0..1

  // deslocamento de peso (lento, ~10-14s) — o corpo nunca fica "travado"
  const shift  = noise(t * 0.11);
  const shift2 = noise(t * 0.07 + 3.3);

  // torso/quadril/ombros (não estão no CTRL_BONES → seta direto, rest=0)
  setBone(h, 'spine',      c.sx + breath * 0.010 * amp,  shift * 0.020 * amp,  c.sz + shift * 0.015 * amp);
  setBone(h, 'chest',      c.sx * 0.5 - inhale * 0.020 * amp,  shift2 * 0.010 * amp,  -shift * 0.010 * amp);
  setBone(h, 'upperChest', -inhale * 0.012 * amp,  0,  0);
  setBone(h, 'hips',       0,  shift * 0.015 * amp,  -shift * 0.020 * amp);
  setBone(h, 'neck',       noise(t * 0.6 + 1.2) * 0.020 * amp,  noise(t * 0.5) * 0.030 * amp,  0);
  setBone(h, 'leftShoulder',  0, 0, -inhale * 0.030 * amp);
  setBone(h, 'rightShoulder', 0, 0,  inhale * 0.030 * amp);

  // cabeça: micro-movimentos + postura + acoplamento com o olhar — ADITIVO
  //  (applyBody já setou a cabeça pela pose; aqui só somamos)
  const head = h.getNormalizedBoneNode('head');
  if (head) {
    head.rotation.x += c.hx + (noise(t * 0.53) * 0.030 + breath * 0.006 + gaze.pitch * 0.45) * amp;
    head.rotation.y += c.hy + (noise(t * 0.41 + 2.1) * 0.040 + gaze.yaw * 0.55) * amp;
    head.rotation.z += c.hz + noise(t * 0.33 + 4.2) * 0.020 * amp;
    // fala: ênfase (leves acenos rítmicos enquanto a boca se mexe)
    if (life.speech > 0.05) {
      head.rotation.x += Math.sin(life.t * 7.5) * 0.020 * life.speech;
      head.rotation.y += Math.sin(life.t * 3.1 + 1) * 0.030 * life.speech;
    }
  }
}

// ---------------- olhar (sacadas + lookAt) ----------------
const gaze = { yaw:0, pitch:0, tYaw:0, tPitch:0, saccade:0 };
function updateGaze(dt) {
  gaze.saccade -= dt;
  if (gaze.saccade <= 0) {                     // nova sacada: escolhe novo ponto
    gaze.saccade = 0.8 + Math.random() * 3.4;
    const a = life.cur.gazeAmp, r = () => Math.random();
    if (life.gazeMode === 'wander')      { gaze.tYaw = (r() - 0.3) * 0.5;  gaze.tPitch = -0.15 - r() * 0.2; }
    else if (life.gazeMode === 'down')   { gaze.tYaw = (r() - 0.5) * 0.15; gaze.tPitch = 0.25 + r() * 0.15; }
    else if (life.gazeMode === 'lock')   { gaze.tYaw = (r() - 0.5) * 0.08 * a; gaze.tPitch = (r() - 0.5) * 0.06; }
    else                                 { gaze.tYaw = (r() - 0.5) * 0.28 * a; gaze.tPitch = (r() - 0.5) * 0.16 * a; }
  }
  const k = Math.min(1, dt * 9);               // sacadas são rápidas
  gaze.yaw   += (gaze.tYaw   - gaze.yaw)   * k;
  gaze.pitch += (gaze.tPitch - gaze.pitch) * k;
  // alvo do lookAt: perto da câmera (engaja o espectador) + desvio do gaze
  gazeTarget.position.set(
    camera.position.x + gaze.yaw * 1.2,
    camera.position.y - gaze.pitch * 1.2,
    camera.position.z,
  );
}

// ---------------- expressões / emoção ----------------
const EMO = {
  happy:'happy', confident:'happy', surprised:'surprised', sad:'sad',
  confused:'sad', focused:'relaxed', thinking:'relaxed', neutral:'neutral',
};
const ALL_EMO = ['happy','angry','sad','relaxed','surprised','neutral'];
let targetEmotion = 'neutral', mouthTarget = 0, mouthNow = 0;

function setEmotion(name) {
  targetEmotion = EMO[name] || 'neutral';
  life.target = EMO_PROFILE[targetEmotion] || EMO_PROFILE.neutral;
  life.gazeMode = GAZE_BY_RAW[name] || life.target.gaze;   // olhar por emoção crua
  $('emotion').textContent = name;
}
function applyExpressions(dt) {
  const em = vrm?.expressionManager; if (!em) return;
  for (const e of ALL_EMO) {
    const cur = em.getValue(e) || 0;
    const goal = (e === targetEmotion) ? 0.85 : 0.0;
    em.setValue(e, cur + (goal - cur) * Math.min(1, dt*8));
  }
  mouthNow += (mouthTarget - mouthNow) * Math.min(1, dt*20);
  em.setValue('aa', mouthNow);   // viseme da boca (lip-sync)
}

// piscar automático (com "piscada dupla" ocasional — mais humano)
let nextBlink = 1.5, blinking = 0, blinkQueue = 0;
const BLINK_DUR = 0.12;
function updateBlink(dt) {
  const em = vrm?.expressionManager; if (!em) return;
  nextBlink -= dt;
  if (nextBlink <= 0 && blinking <= 0) {
    blinking = BLINK_DUR; nextBlink = 2 + Math.random() * 4;
    if (Math.random() < 0.18) blinkQueue = 1;          // ~18%: pisca 2x seguidas
  }
  if (blinking > 0) {
    blinking -= dt;
    em.setValue('blink', Math.sin(Math.max(0, blinking) / BLINK_DUR * Math.PI));
    if (blinking <= 0 && blinkQueue > 0) { blinkQueue = 0; blinking = BLINK_DUR; }
  }
}

// ---------------- loop ----------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);  // limita o dt: molas não explodem
  if (vrm) {
    // envelope de fala (dirige ênfase corporal): sobe rápido, desce suave
    life.speech += ((mouthTarget > 0.05 ? 1 : 0) - life.speech) * Math.min(1, dt * 3);
    applyBody(dt);                 // 1) pose base (braços/gestos + cabeça)
    updateGaze(dt);                // 2) alvo do olhar (sacadas)
    updateLife(dt);               // 3) vida orgânica ADITIVA (respiração/torso/cabeça)
    updateBlink(dt);
    applyExpressions(dt);
    vrm.update(dt);                // atualiza lookAt + molas por último
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---------------- Aila: WebSocket + lip-sync ----------------
let ws, ttsAudio, lipCtx, lipAnalyser, lipBuf;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'avatar.state') {
      setEmotion(m.emotion); $('state').textContent = m.animation || m.speech_state || 'idle';
      if (m.gesture) setPose(m.gesture);
    }
    else if (m.type === 'avatar.gesture') { setPose(m.value); }
    else if (m.type === 'assistant.message' && m.text) speak(m.text);
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

// Embutido na UI principal: NÃO conecta ao /ws (a página-mãe comanda via
// postMessage). Standalone: conecta normalmente.
const EMBEDDED = window.parent && window.parent !== window;
if (!EMBEDDED) connect();
if (EMBEDDED) { const c = document.getElementById('controls'); if (c) c.style.display = 'none'; }

// permite recarregar o VRM padrão (após trocar pelo drawer da UI-mãe)
addEventListener('message', (e) => {
  if ((e.data||{}).type === 'aila:reloadVRM') loadVRM('/static/models/avatar.vrm?t=' + Date.now());
});

// comandos da página-mãe (app.html): emoção e boca (lip-sync)
addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'aila:emotion') {
    setEmotion(d.value); $('state').textContent = d.state || 'idle';
    if (d.gesture) setPose(d.gesture);
  }
  else if (d.type === 'aila:mouth') { mouthTarget = Math.max(0, Math.min(1, d.value)); }
  else if (d.type === 'aila:gesture') { setPose(d.value); }
});

async function speak(text) {
  try {
    const r = await fetch('/api/voice/speak', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})
    });
    if (!r.ok) return;
    const blob = await r.blob();
    if (ttsAudio) { try{ttsAudio.pause();}catch(e){} }
    ttsAudio = new Audio(URL.createObjectURL(blob));
    lipCtx = lipCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (lipCtx.state === 'suspended') await lipCtx.resume();
    const src = lipCtx.createMediaElementSource(ttsAudio);
    lipAnalyser = lipCtx.createAnalyser(); lipAnalyser.fftSize = 1024;
    lipBuf = new Uint8Array(lipAnalyser.fftSize);
    src.connect(lipAnalyser); lipAnalyser.connect(lipCtx.destination);
    driveMouth();
    ttsAudio.onended = () => { mouthTarget = 0; lipAnalyser = null; };
    await ttsAudio.play();
  } catch(e) {}
}
function driveMouth() {
  if (!lipAnalyser) return;
  lipAnalyser.getByteTimeDomainData(lipBuf);
  let sum=0; for (let i=0;i<lipBuf.length;i++){ const v=(lipBuf[i]-128)/128; sum+=v*v; }
  mouthTarget = Math.min(1, Math.sqrt(sum/lipBuf.length) * 4.5);
  requestAnimationFrame(driveMouth);
}

// ---------------- trocar VRM (botão) ----------------
$('pick').addEventListener('click', () => $('vrmfile').click());
$('vrmfile').addEventListener('change', async (ev) => {
  const file = ev.target.files[0]; if (!file) return;
  $('vrmnote').textContent = 'carregando…';
  // 1) troca na hora (preview local, sem esperar o upload)
  loadVRM(URL.createObjectURL(file));
  // 2) salva no servidor como padrão (persiste entre recargas/abas)
  try {
    const fd = new FormData(); fd.append('file', file, file.name);
    const r = await fetch('/api/avatar/vrm', { method:'POST', body:fd });
    $('vrmnote').textContent = r.ok ? '✓ salvo como padrão' : 'trocado (não salvo)';
  } catch(e) { $('vrmnote').textContent = 'trocado (não salvo)'; }
  setTimeout(() => $('vrmnote').textContent = '', 4000);
  ev.target.value = '';
});

// permite testar do console / do chat: window.ailaSpeak("texto")
window.ailaSpeak = speak;
window.ailaEmotion = setEmotion;
</script>
</body>
