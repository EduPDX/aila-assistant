<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' data: blob: ws://127.0.0.1:* ws://localhost:* wss://127.0.0.1:* wss://localhost:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
<title>Aila — Avatar 3D</title>
<style>
  :root { --accent:#35d0ba; --bg:#0a0e14; --panel:#0f1620; --border:#1e2a3a; --muted:#6b7c93; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:radial-gradient(circle at 50% 30%, #16202c, var(--bg)); overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif; color:#d7e0ea; }
  #app { position:fixed; inset:0; }
  #canvas { width:100%; height:100%; display:block; }
  /* overlay ocultado: o espaço superior-esquerdo é do mini-subconsciente; a
     emoção/estado já aparecem no HUD direito do app. Os spans ficam (JS os
     atualiza sem erro), só invisíveis. */
  #hud { display:none; position:fixed; left:14px; top:12px; font-size:12px; color:var(--muted);
    background:rgba(15,22,32,.6); border:1px solid var(--border); border-radius:10px; padding:8px 12px; }
  #hud b { color:var(--accent); }
  #emotion { color:var(--accent); text-transform:uppercase; letter-spacing:1px; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:8%;
    text-align:center; line-height:1.6; }
  #err.show { display:flex; }
  #err code { background:var(--panel); padding:2px 6px; border-radius:4px; color:var(--accent); }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
</style>
</head>
<body>
  <div id="app"><canvas id="canvas"></canvas></div>
  <div id="loading">carregando avatar 3D…</div>
  <div id="hud">
    <div>Aila · avatar 3D (VRM)</div>
    <div>emoção: <span id="emotion">neutral</span> · <span id="state">idle</span></div>
  </div>
  <!-- Debug Mode (P0): oculto por padrão; tecla D, ?debug=1 ou window.ailaDebug.toggle() -->
  <div id="dbg" style="display:none;position:fixed;left:14px;bottom:12px;z-index:20;font-size:11px;
    line-height:1.6;color:#c7d3e0;background:rgba(10,14,20,.82);border:1px solid #e06c7566;
    border-radius:8px;padding:9px 12px;max-width:60vw;font-family:ui-monospace,monospace"></div>
  <div id="controls" style="position:fixed;right:14px;top:12px;display:flex;gap:8px;align-items:center">
    <span id="vrmnote" style="font-size:11px;color:var(--muted)"></span>
    <button id="pick" style="background:var(--panel);border:1px solid var(--border);
      color:var(--accent);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px">
      📁 Escolher VRM</button>
    <input type="file" id="vrmfile" accept=".vrm" style="display:none" />
  </div>
  <div id="err">
    <div>
      <h2>Nenhum modelo VRM encontrado 🙈</h2>
      <p>Coloque um arquivo <code>.vrm</code> em <code>ui/models/avatar.vrm</code><br>
      (crie um grátis no <b>VRoid Studio</b> e exporte como VRM), ou abra com
      <code>?model=URL</code>.</p>
      <p id="errdetail" style="color:var(--muted);font-size:12px;margin-top:10px"></p>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/addons/",
    "@pixiv/three-vrm": "/static/vendor/three-vrm.module.min.js",
    "@pixiv/three-vrm-animation": "/static/vendor/three-vrm-animation.module.min.js"
  }
}
</script>
<script type="module">
// ============================================================
//  Avatar3D — só BOOT do renderer (cena/câmera/VRM/interação/voz).
//  TODA a animação vive no sistema em camadas: ./avatar/*  (import relativo
//  funciona tanto em /static/ quanto num servidor estático de teste).
// ============================================================
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';
import { AnimationController } from './avatar/animation-controller.js';
import { AvatarDebug } from './avatar/debug.js';
import { SceneManager } from './avatar/cognitive-scene/scene-manager.js';   // Cognitive Scene (Fase 1)
import { loadSceneDef, applySceneDef } from './avatar/cognitive-scene/scene-loader.js';  // Fase 7: JSON declarativo

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const MODEL_URL = params.get('model') || '/static/models/avatar.vrm';
let currentModelUrl = MODEL_URL;   // p/ recarregar no restore do contexto WebGL

// ---------------- cena ----------------
const renderer = new THREE.WebGLRenderer({ canvas: $('canvas'), antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

// Recuperação de CONTEXTO WebGL: sob pressão de VRAM (ex.: Ollama carregando um
// modelo grande enquanto a GPU renderiza o VRM), o navegador pode PERDER o
// contexto → o avatar "some". Preventivo: pausa e, ao restaurar, recarrega o VRM.
let _ctxLost = false;
$('canvas').addEventListener('webglcontextlost', (e) => {
  e.preventDefault();                 // permite a restauração
  _ctxLost = true;
  console.warn('WebGL context perdido (VRAM?) — aguardando restauração.');
}, false);
$('canvas').addEventListener('webglcontextrestored', () => {
  _ctxLost = false;
  console.warn('WebGL context restaurado — recarregando o avatar.');
  try { loadVRM(currentModelUrl); } catch (e) {}
}, false);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 20);
camera.position.set(0, 1.0, 3.0);   // fallback (corpo inteiro) até frameVRM() ajustar ao modelo

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;               // esquerdo = orbitar, scroll = zoom; direito = pan (abaixo)
controls.minDistance = 0.4; controls.maxDistance = 8;
controls.update();

// Cognitive Scene (Fase 1): ambiente holográfico na MESMA scene/câmera/loop.
// Flag localStorage 'aila.scene'='off' desliga tudo (avatar volta ao normal).
const sceneManager = new SceneManager(scene, camera, controls);
window.ailaScene = sceneManager;   // console: ailaScene.setEnabled(false)

// Fase 7: carrega definição declarativa da cena (JSON). Assíncrono: se o JSON
// não existir ou falhar, os defaults hardcoded são mantidos.
let _sceneDef = null;
loadSceneDef('/static/avatar/cognitive-scene/scene-definition.json').then((d) => { _sceneDef = d; applySceneDef(sceneManager, d); });

// enquadra o VRM inteiro (cabeça aos pés), adaptando a qualquer altura de modelo
function frameVRM() {
  if (!vrm) return;
  vrm.scene.updateWorldMatrix(true, true);
  const box = new THREE.Box3().setFromObject(vrm.scene);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const fov = camera.fov * Math.PI / 180;
  const fitH = (size.y / 2) / Math.tan(fov / 2);
  const fitW = (size.x / 2) / Math.tan(fov / 2) / Math.max(0.5, camera.aspect);
  const dist = Math.max(fitH, fitW) * 1.12;
  controls.target.copy(center);
  camera.position.set(center.x, center.y, center.z + dist);
  controls.minDistance = dist * 0.25;
  controls.maxDistance = dist * 3.5;
  controls.update();
}
window.ailaFrame = frameVRM;

// --------- pan no BOTÃO DIREITO (reposiciona o enquadramento) ---------
(() => {
  const dom = renderer.domElement;
  let panning = false, px = 0, py = 0;
  const R = new THREE.Vector3(), U = new THREE.Vector3(), mv = new THREE.Vector3();
  dom.addEventListener('pointerdown', (e) => {
    if (e.button !== 2) return;
    panning = true; px = e.clientX; py = e.clientY;
    try { dom.setPointerCapture(e.pointerId); } catch (_) {}
  });
  addEventListener('pointermove', (e) => {
    if (!panning) return;
    const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
    const dist = camera.position.distanceTo(controls.target);
    const perPx = (2 * Math.tan((camera.fov * Math.PI / 180) / 2) * dist) / dom.clientHeight;
    R.setFromMatrixColumn(camera.matrix, 0);
    U.setFromMatrixColumn(camera.matrix, 1);
    mv.set(0, 0, 0).addScaledVector(R, dx * perPx).addScaledVector(U, -dy * perPx);
    camera.position.add(mv); controls.target.add(mv); controls.update();
  });
  const stop = (e) => { if (e.button === 2 || e.type === 'pointercancel') panning = false; };
  addEventListener('pointerup', stop);
  addEventListener('pointercancel', stop);
  dom.addEventListener('dblclick', () => frameVRM());
})();

scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(1, 2, 2); scene.add(dir);
const rim = new THREE.DirectionalLight(0x35d0ba, 0.6);
rim.position.set(-1, 1, -2); scene.add(rim);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------- carregar VRM ----------------
let vrm = null;
let controller = null;      // AnimationController (sistema em camadas)
const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
loader.register((parser) => new VRMAnimationLoaderPlugin(parser));   // P6: carrega .vrma

// Loader DEDICADO aos clips: alguns .vrma (Mixamo) referenciam uma textura
// externa (Image_0.jpg) que NÃO usamos (só a animação importa) → o GLTFLoader
// buscava e dava 404. Aqui um pixel transparente responde no lugar (sem 404).
const _blankPNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
const _clipMgr = new THREE.LoadingManager();
_clipMgr.setURLModifier((u) => (/\.(jpe?g|png|webp|bmp|gif)$/i.test(u) ? _blankPNG : u));
const clipLoader = new GLTFLoader(_clipMgr);
clipLoader.register((parser) => new VRMAnimationLoaderPlugin(parser));

// ---------------- biblioteca de gestos VRMA (P7) ----------------
//  Intenção → arquivo .vrma (em ui/models/gestures/). Opt-in e com FALLBACK:
//  se o clip não existe (ou clips desligados), cai no gesto procedural de sempre.
const GESTURE_CLIPS = { wave: 'wave.vrma', nod: 'nod.vrma', shake: 'shake.vrma', point: 'point.vrma', shrug: 'shrug.vrma',
  talk1: 'talk1.vrma', talk2: 'talk2.vrma', talk3: 'talk3.vrma', talk4: 'talk4.vrma' };
const TALK = ['talk1', 'talk2', 'talk3', 'talk4'];   // clips de "conversa" (gesticulação natural da fala)
const clipCache = {};   // intenção -> AnimationClip | 'loading' | 'fail'
const clipsEnabled = () => localStorage.getItem('aila.avatar.clips') !== 'false';

async function probeGestureClips() {   // marca os que faltam como 'fail' → fallback limpo
  for (const [g, file] of Object.entries(GESTURE_CLIPS)) {
    try { const r = await fetch('/static/models/gestures/' + file, { method: 'HEAD' }); if (!r.ok) clipCache[g] = 'fail'; }
    catch (e) { clipCache[g] = 'fail'; }
  }
}

// devolve true se um CLIP cobre a intenção (tocando ou carregando); false → procedural
function playGestureClip(name) {
  if (!clipsEnabled() || !vrm || !controller) return false;
  const file = GESTURE_CLIPS[name];
  if (!file) return false;
  const c = clipCache[name];
  if (c === 'fail') return false;
  if (c === 'loading') return true;
  if (c) { controller.playClip(c); return true; }
  clipCache[name] = 'loading';
  clipLoader.load('/static/models/gestures/' + file, (gltf) => {
    const va = gltf.userData.vrmAnimations && gltf.userData.vrmAnimations[0];
    if (!va) { clipCache[name] = 'fail'; return; }
    const clip = createVRMAnimationClip(va, vrm);
    // remove ROOT MOTION (faixas de posição, ex.: hips.position) — os .vrma de
    // Mixamo deslocam o quadril e faziam o avatar "sumir pra baixo e voltar".
    // Gesto fica NO LUGAR (só rotações + expressões/olhar).
    clip.tracks = clip.tracks.filter((t) => !t.name.endsWith('.position'));
    clipCache[name] = clip;
    controller.playClip(clip);                      // toca assim que carrega (1ª vez)
  }, undefined, () => { clipCache[name] = 'fail'; });
  return true;
}
// gesticulação natural da FALA: toca um clip de "conversa" aleatório (o controller
// chama isso em intervalos enquanto ela fala). Devolve true se há clips disponíveis.
function playRandomTalkClip() {
  if (!clipsEnabled()) return false;
  const avail = TALK.filter((t) => clipCache[t] !== 'fail');
  if (!avail.length) return false;
  return playGestureClip(avail[Math.floor(Math.random() * avail.length)]);
}
// teste/console: dispara uma intenção pela biblioteca (ex.: ailaPlayClip('wave'))
window.ailaPlayClip = (name = 'wave') => playGestureClip(name) || (controller && controller.triggerGesture(name));

// Série de movimentos (demonstração): toca cada gesto e volta ao repouso entre
// eles, espaçado por tempo — INDEPENDENTE da fala (a timeline de gestos da fala
// pararia se a frase acabasse antes da série). Cancela uma série anterior.
let _seqTimers = [];
function playGestureSequence(names) {
  _seqTimers.forEach(clearTimeout); _seqTimers = [];
  if (!controller || !Array.isArray(names) || !names.length) return;
  const HOLD = 1500, GAP = 600;   // ms segurando o gesto + pausa em repouso
  controller.ctx._seqActive = true;              // fala não gesticula durante a série
  let t = 0;
  for (const name of names) {
    _seqTimers.push(setTimeout(() => controller.triggerGesture(name), t));
    _seqTimers.push(setTimeout(() => controller.triggerGesture('rest'), t + HOLD));
    t += HOLD + GAP;
  }
  _seqTimers.push(setTimeout(() => { controller.ctx._seqActive = false; }, t + 200));
}
window.ailaPlaySequence = playGestureSequence;   // teste no console

function disposeVRM() {
  if (!vrm) return;
  scene.remove(vrm.scene);
  try { VRMUtils.deepDispose?.(vrm.scene); } catch(e){}
  vrm = null; window.vrm = null;
}

function loadVRM(url, revokeWhenDone = false) {
  currentModelUrl = url;
  $('err').classList.remove('show');
  $('loading').style.display = 'flex';
  loader.load(url, (gltf) => {
    disposeVRM();
    if (controller) { try { scene.remove(controller.rig.gazeTarget); } catch(e){} }  // limpa alvo antigo
    vrm = gltf.userData.vrm;
    if (vrm.meta?.metaVersion === '0') VRMUtils.rotateVRM0(vrm);  // VRM0 encara a câmera
    vrm.scene.traverse((o) => {
      o.frustumCulled = false;
      // O corpo é a camada principal do palco e deve cobrir corretamente a
      // infraestrutura holográfica posicionada atrás dele.
      if (o.isMesh || o.isSkinnedMesh) o.renderOrder = 20;
    });
    scene.add(vrm.scene);
    window.vrm = vrm;
    controller = new AnimationController(vrm, scene, camera);   // ← animação em camadas
    window.ailaAnim = controller;                              // debug/console
    controller.clipFor = playGestureClip;                      // P7: gestos por clip (fallback procedural)
    controller.playTalkClip = playRandomTalkClip;              // gesticulação natural da fala por clips
    probeGestureClips();                                       // sabe quais .vrma existem
    debug.attach(controller);                                  // Debug Mode segue o VRM atual
    try { vrm.springBoneManager?.reset?.(); } catch(e){}       // molas assentadas
    clock.getDelta();                                          // zera o dt (evita saia "explodir")
    frameVRM();
    sceneManager.build();                                      // Cognitive Scene: chão + monitor (1x)
    sceneManager.setController(controller);                    // Fase 3: IK aponta p/ a cena
    sceneManager.compose(vrm);                                 // posiciona monitor + diagonal + enquadra o palco
    $('loading').style.display = 'none';
    if (revokeWhenDone) URL.revokeObjectURL(url);
  }, undefined, (e) => {
    $('loading').style.display = 'none';
    $('err').classList.add('show');
    $('errdetail').textContent = 'tentei carregar: ' + url + '  ·  ' + (e?.message || e);
    if (revokeWhenDone) URL.revokeObjectURL(url);
  });
}

// ---------------- Debug Mode (P0) ----------------
const debug = new AvatarDebug(scene, camera, $('dbg'));
window.ailaDebug = debug;                                   // console: ailaDebug.toggle()
if (params.get('debug') === '1') debug.toggle(true);        // ?debug=1 já liga
addEventListener('keydown', (e) => {                        // tecla D liga/desliga
  if ((e.key === 'd' || e.key === 'D') && !e.ctrlKey && !e.metaKey && !e.altKey) debug.toggle();
});

// ---------------- loop ----------------
const clock = new THREE.Clock();
let paused = false;   // P8: pausa quando o avatar NÃO está visível (chat/🧠) ou a
                      // aba está em segundo plano → não renderiza um VRM à toa.
function animate() {
  requestAnimationFrame(animate);
  if (paused || document.hidden || _ctxLost) { clock.getDelta(); return; }   // zera o dt e sai
  const dt = Math.min(clock.getDelta(), 0.05);   // limita o dt: molas não explodem
  if (controller) controller.update(dt);          // camadas → PoseBuffer → VRM
  sceneManager.update(dt);                         // Cognitive Scene (monitor/scanlines/anel)
  debug.update();                                 // helpers só quando ligado
  controls.update();
  renderer.render(scene, camera);
  reportBody();                                   // corpo -> backend (Fase D)
}

// ---------------- Body report (Cognitive Core, Fase D) ----------------
//  A Aila precisa SABER o que o corpo dela está fazendo — senão fala em 3ª
//  pessoa ("o avatar está com a mão levantada"). Aqui medimos o estado REAL
//  (posição dos ossos, não a intenção) e mandamos p/ o backend quando MUDA.
let _bodyLast = '', _bodyT = 0;
function reportBody() {
  if (!vrm || !controller) return;
  const now = performance.now();
  if (now - _bodyT < 500) return;                 // no máx. 2x/s (barato)
  _bodyT = now;
  let rep;
  try { rep = readBodyState(); } catch (e) { return; }
  const sig = JSON.stringify(rep);
  if (sig === _bodyLast) return;                  // só quando MUDA
  _bodyLast = sig;
  try { parent.postMessage({ type: 'body.report', body: rep }, location.origin); } catch (e) {}
}

function readBodyState() {
  const h = vrm.humanoid, ctx = controller.ctx;
  const wy = (bone) => {                          // altura de mundo de um osso
    const n = h.getNormalizedBoneNode(bone);
    if (!n) return null;
    n.updateWorldMatrix(true, false);
    return n.matrixWorld.elements[13];
  };
  const hands = {};
  for (const side of ['left', 'right']) {
    const hand = wy(side + 'Hand'), sh = wy(side + 'UpperArm');
    // Mão na ALTURA do ombro (ou acima) = levantada. Medido no modelo real:
    // em repouso a mão fica ~0.36 abaixo do ombro; com o braço erguido chega à
    // altura dele. Exigir "acima do ombro" nunca disparava.
    hands[side] = (hand != null && sh != null && hand > sh - 0.10)
      ? 'raised'
      : (ctx.handPose && ctx.handPose[side] === 'point' ? 'pointing' : 'rest');
  }
  const inter = sceneManager.lastInteraction || null;
  return {
    posture: ctx.status === 'THINKING' ? 'thinking' : 'standing',
    gesture: ctx.gesture || 'rest',
    hands,
    gaze_target: ctx.gazeWorld ? (inter && inter.target ? inter.target : 'a tela') : '',
    interaction_target: inter ? (inter.target || '') : '',
    interaction_action: inter ? (inter.type || '') : '',
  };
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });
animate();
loadVRM(MODEL_URL);

// ---------------- comandos (emoção / estado / gesto / boca) ----------------
function applyEmotion(name, gesture) {
  if (!controller || !name) return;
  controller.setEmotion(name);
  if (gesture) controller.triggerGesture(gesture);
  $('emotion').textContent = name;
}
function applyStatus(status) {
  if (!controller || !status) return;
  controller.setStatus(status);
  $('state').textContent = String(status).toLowerCase();
}

// VRAM Fase 2: o avatar DEGRADA sob pressão em vez de deixar o WebGL cair.
// O framebuffer escala com pixelRatio² — cair de 2 → 0.6 corta o custo de VRAM
// do render para ~9%. É a alavanca de VRAM real no cliente (o pai manda o estado
// verde/amarelo/vermelho medido por nvidia-smi). Reaplica o size p/ realocar o buffer.
let vramState = 'green';
function applyVramPressure(state) {
  if (state === vramState) return;
  vramState = state || 'green';
  const cap = Math.min(window.devicePixelRatio, 2);
  const ratio = vramState === 'red' ? 0.6 : vramState === 'yellow' ? 1.0 : cap;
  renderer.setPixelRatio(ratio);
  renderer.setSize(innerWidth, innerHeight);   // realoca o drawing buffer no novo ratio
  sceneManager.setVramState(vramState);        // 🔴 esconde a cena cognitiva (prioriza o avatar)
  console.info(`[avatar] pressão de VRAM: ${vramState} → pixelRatio ${ratio.toFixed(2)}`);
}

// ---------------- Aila: WebSocket (standalone) ----------------
let ws, ttsAudio, ttsObjectUrl, lipCtx, lipAnalyser, lipBuf;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'avatar.behavior') { controller?.applyBehavior(m); $('emotion').textContent = m.emotion || 'neutral'; sceneManager.setState(m.cognitive_ui || m.intent, m.interaction); }
    else if (m.type === 'avatar.state') applyEmotion(m.emotion, m.gesture);
    else if (m.type === 'avatar.gesture') controller?.triggerGesture(m.value);
    else if (m.type === 'aila.state') applyStatus(m.status);
    else if (m.type === 'assistant.message' && m.text && !EMBEDDED) speak(m.text);  // standalone only
    else if (m.type === 'thinking.step') sceneManager.showThinking(m.text || '...');
    else if (m.type === 'thinking.done') sceneManager.hideThinking();
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
// Embutido na UI (app.html): a página-mãe comanda via postMessage. Standalone: /ws.
const EMBEDDED = window.parent && window.parent !== window;
if (!EMBEDDED) connect();
if (EMBEDDED) { const c = $('controls'); if (c) c.style.display = 'none'; }

addEventListener('message', (e) => {
  if (EMBEDDED && (e.origin !== location.origin || e.source !== parent)) return;
  const d = e.data || {};
  switch (d.type) {
    case 'aila:reloadVRM': loadVRM('/static/models/avatar.vrm?t=' + Date.now()); break;
    case 'aila:emotion':   applyEmotion(d.value, d.gesture); if (d.state) $('state').textContent = d.state; break;
    case 'aila:behavior':  controller?.applyBehavior(d.spec); if (d.spec) { $('emotion').textContent = d.spec.emotion || 'neutral'; sceneManager.setState(d.spec.cognitive_ui || d.spec.intent, d.spec.interaction); } break;
    case 'aila:status':    applyStatus(d.value); break;
    case 'aila:show':      paused = false; clock.getDelta(); sceneManager.setPaused(false); break;   // volta ao palco → retoma
    case 'aila:hide':      paused = true; sceneManager.setPaused(true); break;                       // saiu do palco → pausa render
    case 'aila:mouth':     controller?.setMouth(d.value); break;
    case 'aila:gesture':   controller?.triggerGesture(d.value); break;
    case 'aila:gesture_seq': playGestureSequence(d.values); break;
    case 'aila:vram-pressure': applyVramPressure(d.state); break;
    case 'aila:metrics':   sceneManager.setMetrics(d.payload); break;   // dados reais → tela de STATUS
    case 'aila:telemetry': sceneManager.setTelemetry(d.payload); break; // dados reais → tela PRINCIPAL
    case 'aila:infrastructure': sceneManager.setInfrastructure(d.payload); break;
    case 'aila:say':       sceneManager.showMessage(d.text); break;     // resumo → balão holográfico
    case 'aila:interaction': sceneManager.interact(d.spec); break;      // {type,target} → aponta (IK)
    case 'aila:thinking.step': sceneManager.showThinking(d.text || '...'); break;
    case 'aila:thinking.done': sceneManager.hideThinking(); break;
  }
});

// ---------------- voz + lip-sync (dirige a boca via controller) ----------------
async function speak(text) {
  try {
    const r = await fetch('/api/voice/speak', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})
    });
    if (!r.ok) return;
    const blob = await r.blob();
    if (ttsAudio) { try{ttsAudio.pause();}catch(e){} }
    if (ttsObjectUrl) URL.revokeObjectURL(ttsObjectUrl);
    ttsObjectUrl = URL.createObjectURL(blob);
    ttsAudio = new Audio(ttsObjectUrl);
    lipCtx = lipCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (lipCtx.state === 'suspended') await lipCtx.resume();
    const src = lipCtx.createMediaElementSource(ttsAudio);
    lipAnalyser = lipCtx.createAnalyser(); lipAnalyser.fftSize = 1024;
    lipBuf = new Uint8Array(lipAnalyser.fftSize);
    src.connect(lipAnalyser); lipAnalyser.connect(lipCtx.destination);
    driveMouth();
    ttsAudio.onended = () => {
      controller?.setMouth(0); lipAnalyser = null;
      if (ttsObjectUrl) { URL.revokeObjectURL(ttsObjectUrl); ttsObjectUrl = null; }
    };
    await ttsAudio.play();
  } catch(e) {}
}
function driveMouth() {
  if (!lipAnalyser) return;
  lipAnalyser.getByteTimeDomainData(lipBuf);
  let sum=0; for (let i=0;i<lipBuf.length;i++){ const v=(lipBuf[i]-128)/128; sum+=v*v; }
  controller?.setMouth(Math.min(1, Math.sqrt(sum/lipBuf.length) * 4.5));
  requestAnimationFrame(driveMouth);
}

// ---------------- trocar VRM (botão) ----------------
$('pick').addEventListener('click', () => $('vrmfile').click());
$('vrmfile').addEventListener('change', async (ev) => {
  const file = ev.target.files[0]; if (!file) return;
  $('vrmnote').textContent = 'carregando…';
  loadVRM(URL.createObjectURL(file), true);
  try {
    const fd = new FormData(); fd.append('file', file, file.name);
    const r = await fetch('/api/avatar/vrm', { method:'POST', body:fd });
    $('vrmnote').textContent = r.ok ? '✓ salvo como padrão' : 'trocado (não salvo)';
  } catch(e) { $('vrmnote').textContent = 'trocado (não salvo)'; }
  setTimeout(() => $('vrmnote').textContent = '', 4000);
  ev.target.value = '';
});

// atalhos p/ console / testes
window.ailaSpeak = speak;
window.ailaEmotion = (name, gesture) => applyEmotion(name, gesture);
window.ailaStatus = (s) => applyStatus(s);
window.ailaGesture = (g) => controller?.triggerGesture(g);
</script>
